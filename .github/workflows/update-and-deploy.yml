# Раз в полчаса: забрать измерения GIOŚ, сохранить их в ветку `data` и опубликовать сайт.
# Раз в полчаса процесс запускает будильник на Cloudflare (папка worker/) через workflow_dispatch.
# Своего расписания (schedule) у процесса нет: в этом репозитории оно не работает (см. docs/DECISIONS.md).
# Ещё процесс запускается при каждом изменении кода в main и вручную (кнопка Run workflow).

name: Обновление данных и публикация

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url || steps.deployment-retry-2.outputs.page_url }}
    steps:
      - name: Код приложения
        uses: actions/checkout@v5

      - name: Ветка с данными
        uses: actions/checkout@v5
        with:
          ref: data
          path: data-store

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Тесты
        run: npm test

      - name: Сбор измерений GIOŚ
        run: node scripts/update-data.mjs --store data-store

      - name: Сохранение данных в ветку data
        working-directory: data-store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Новых данных нет"
          else
            git commit -q -m "Данные GIOŚ $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push -q
          fi

      - name: Сборка сайта
        run: |
          cp -r web _site
          mkdir -p _site/data
          cp data-store/latest.json _site/data/latest.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # С 11.11.2026 GitHub часто не находит только что загруженный сайт
      # («No artifacts named github-pages were found»). Это задержка на стороне GitHub,
      # поэтому при неудаче публикация повторяется ещё два раза: через 30 и через 60 секунд.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Пауза перед повтором публикации
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Пауза перед последним повтором
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        run: sleep 60

      - id: deployment-retry-2
        if: steps.deployment.outcome == 'failure' && steps.deployment-retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
